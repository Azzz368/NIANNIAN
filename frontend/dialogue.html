<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>念念 · 数字人对话</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .dh-grid{display:grid;grid-template-columns:1fr 2.2fr;gap:22px;align-items:start;}
  @media (max-width:880px){ .dh-grid{grid-template-columns:1fr;} }
  .persona-status{display:inline-block;font-size:.72rem;padding:3px 12px;border-radius:999px;margin-bottom:10px;}
  .status-active{background:rgba(90,154,114,.12);color:var(--green);border:1px solid rgba(90,154,114,.3);}
  .status-default{background:var(--gold-dim);color:var(--gold);border:1px solid var(--border-h);}
  .merge-preview{background:var(--surf2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:.82rem;color:var(--ink-m);line-height:1.7;max-height:140px;overflow-y:auto;white-space:pre-wrap;margin-bottom:10px;}
  .persona-card{background:linear-gradient(135deg,var(--surf2),var(--surf));border:1px solid var(--border-h);border-radius:14px;padding:14px 18px;display:flex;align-items:center;gap:14px;margin-bottom:18px;box-shadow:0 2px 10px rgba(156,122,69,.07);}
  .persona-avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#C4964A,#E8C57A);display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.2rem;font-family:"Cormorant Garamond",serif;font-weight:600;flex-shrink:0;}
  .persona-name{font-family:"Cormorant Garamond",serif;font-size:1.1rem;font-weight:600;color:var(--ink);}
  .persona-meta{font-size:.75rem;color:var(--muted-l);margin-top:2px;}
  .persona-tag{display:inline-block;background:var(--gold-dim);border:1px solid var(--border-h);border-radius:999px;padding:2px 9px;font-size:.7rem;color:var(--gold);margin:2px 3px;}
  .dna-metric{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed var(--border);font-size:.85rem;}
  .dna-metric:last-child{border-bottom:none;}
  .dna-metric span:first-child{color:var(--muted-l);font-size:.78rem;}
  .dna-metric span:last-child{color:var(--ink);font-weight:500;}
  .phrase-box{background:var(--surf2);border:1px solid var(--border);border-radius:10px;padding:8px 14px;margin:6px 0;font-size:.85rem;color:var(--ink-m);font-style:italic;}
  .file-zone{position:relative;}
  .file-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}
</style>
</head>
<body>
<div class="container">

  <div class="topbar">
    <div class="topbar-logo">
      <div class="topbar-orb">念</div>
      <div>
        <div class="topbar-name">数字人对话</div>
        <div class="topbar-sub">Digital Person Dialogue</div>
      </div>
    </div>
    <a class="btn btn-ghost" href="index.html">返回主页</a>
  </div>

  <!-- ========== Step A：上传聊天记录 + 风格分析 ========== -->
  <section id="stepUpload">
    <div class="card">
      <div class="section-label">Step 1 · 填写角色信息</div>
      <div class="form-grid">
        <div class="field">
          <label>姓名 / 称谓</label>
          <input type="text" id="dlgName" placeholder="例：爸爸 · 奶奶 · 张伟">
        </div>
        <div class="field">
          <label>角色补充描述（选填）</label>
          <input type="text" id="dlgRoleExtra" placeholder="如：温和幽默，爱聊家常">
        </div>
      </div>
    </div>

    <div class="card">
      <div class="section-label">Step 2 · 上传聊天记录</div>
      <label class="upload-zone file-zone" id="fileZone">
        <div id="fileZoneLabel">点击或拖拽上传聊天记录文件<br/>
          <span class="text-muted">支持 CSV（WeChatMsg/留痕）、JSON、TXT</span>
        </div>
        <input type="file" id="dlgFile" accept=".csv,.json,.txt">
      </label>
      <div id="filePicked" class="text-muted" style="margin-top:10px;"></div>
    </div>

    <div class="card">
      <div class="section-label">Step 3 · 开始分析</div>
      <p class="text-muted" style="margin-bottom:12px;">AI 会提取 TA 的口头禅、情感基调、句式习惯，预计 20–40 秒。</p>
      <button class="btn btn-primary btn-block" id="btnAnalyze" type="button">开始 AI 风格分析</button>
    </div>

    <div id="analyzingPanel" class="card hidden text-center" style="padding:34px;">
      <div class="think-wrap" style="margin:0 auto 18px;width:48px;height:48px;">
        <div class="think-orb" style="width:48px;height:48px;"></div>
        <div class="think-ring"></div>
        <div class="think-ring r2"></div>
      </div>
      <div style="font-family:'Cormorant Garamond',serif;font-size:1.15rem;color:var(--ink);margin-bottom:6px;">AI 正在分析说话风格…</div>
      <div class="text-muted">正在提取口头禅、情感基调、句式习惯，约 20–40 秒</div>
    </div>
  </section>

  <!-- ========== Step B：对话主界面 ========== -->
  <section id="stepChat" class="hidden">
    <div class="dh-grid">

      <!-- 左：人设编辑器 -->
      <div class="card">
        <div class="section-label">人设编辑器</div>
        <div id="personaStatus"></div>
        <div id="overrideWrap" class="hidden">
          <label class="text-muted" style="font-size:.74rem;">当前生效人设</label>
          <div class="merge-preview" id="currentOverride"></div>
        </div>
        <div class="field">
          <label>新增 / 修改人设</label>
          <textarea id="personaInput" rows="4" placeholder="例：&#10;· 补充：TA 特别喜欢聊美食&#10;· 修改：更沉稳，少用哈哈"></textarea>
        </div>
        <div class="btn-row" style="margin-top:6px;">
          <button class="btn btn-primary" id="btnPersonaUpdate" type="button" style="flex:1;">更新人设</button>
          <button class="btn" id="btnPersonaClear" type="button" style="flex:1;">清空人设</button>
        </div>

        <div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--border);">
          <div class="text-muted" style="font-size:.74rem;font-weight:700;letter-spacing:.05em;margin-bottom:8px;">风格档案</div>
          <div id="dnaPanel"></div>
        </div>

        <div class="btn-row" style="margin-top:14px;">
          <button class="btn" id="btnDlgClearHist" type="button" style="flex:1;">清空对话</button>
          <button class="btn" id="btnDlgReupload" type="button" style="flex:1;">重新上传</button>
        </div>
      </div>

      <!-- 右：对话区 -->
      <div>
        <div class="persona-card" id="personaCard"></div>

        <div id="dlgChatWrap" class="chat-wrap"></div>

        <div id="dlgThink" class="hidden">
          <div class="think-row">
            <div class="think-wrap">
              <div class="think-orb"></div>
              <div class="think-ring"></div>
              <div class="think-ring r2"></div>
            </div>
            <div class="think-bubble">
              <div class="think-dots"><span></span><span></span><span></span></div>
              <div class="think-label" id="dlgThinkLabel">念念正在思考...</div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="flex-row" style="gap:10px;">
            <input type="text" id="dlgInput" placeholder="和 TA 说点什么..."
                   style="flex:1;background:var(--surf);border:1px solid var(--border);border-radius:12px;padding:11px 14px;font-size:1rem;font-family:inherit;color:var(--ink);">
            <button class="btn btn-primary" id="btnDlgSend" type="button">发送</button>
          </div>
        </div>
      </div>

    </div>
  </section>

</div>

<script src="js/api.js"></script>
<script src="js/dialogue.js"></script>
</body>
</html>
