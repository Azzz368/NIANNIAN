services:
  - type: web
    name: niannian-memorial
    runtime: python
    rootDir: .
    buildCommand: apt-get update && apt-get install -y ffmpeg && pip install -r backend/requirements.txt && python -m playwright install chromium
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # ─── FFmpeg（分镜视频拼接功能依赖）───
      # apt 安装后 ffmpeg 已在 PATH 中，一般无需手动设置；
      # 若运行时找不到，可显式指定绝对路径（Render 官方 Python 镜像通常是 /usr/bin/ffmpeg）
      - key: FFMPEG_PATH
        value: /usr/bin/ffmpeg
      - key: AI302_API_KEY
        sync: false          # 在 Render 控制台手动填写，不写进代码
      - key: AI302_TEXT_MODEL
        value: gemini-2.5-flash
      - key: AI302_TEXT_FALLBACK
        value: claude-sonnet-4-6
      - key: AI302_STORYBOARD_MODEL
        value: gemini-2.5-flash
      - key: AI302_AUDIO_MODEL
        value: whisper-1
      - key: AI302_VISION_MODEL
        value: gemini-2.5-flash
      # ─── TokenStar（分镜首帧图 + Seedance 素材图生视频）───
      - key: TOKENSTAR_API_KEY
        sync: false
      - key: TOKENSTAR_BASE_URL
        value: https://api.tokenstar.world
      - key: TOKENSTAR_IMAGE_MODEL
        value: gpt-image-2
      - key: TOKENSTAR_IMAGE_SOURCE_SIZE
        value: 2048x1152
      - key: TOKENSTAR_SEEDANCE_MODEL
        value: seedance-2.0-asset-fast
      - key: TOKENSTAR_SEEDANCE_ASSET_MODEL
        value: volc-asset
      - key: TOKENSTAR_ASSET_POLL_INTERVAL_MS
        value: "1500"
      - key: TOKENSTAR_ASSET_MAX_POLL_ATTEMPTS
        value: "20"
      - key: TOKENSTAR_ASSET_VIDEO_CREATE_RETRY_MS
        value: "5000"
      - key: TOKENSTAR_ASSET_VIDEO_CREATE_MAX_ATTEMPTS
        value: "8"
      # 旧制作台流程兼容配置。
      - key: TOKENSTAR_KLING_MODEL
        value: kling-v3
      # 默认启用 Kling 音频生成。
      - key: TOKENSTAR_KLING_SOUND
        value: "on"
      # ─── DashScope 通义千问（联网搜索功能专用）───
      # 在 Render 控制台填入你的阿里云 DashScope API Key（以 sk- 开头）
      # Key 与区域必须对应：国际站填 intl；中国站填 cn
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: DASHSCOPE_REGION
        value: intl           # 国际站；国内站 Key 请改为 cn
      # 素材库图片理解与语义检索（与 DASHSCOPE_API_KEY 共用）
      - key: NIAN_ASSET_VISION_MODEL
        value: qwen-vl-plus
      - key: NIAN_ASSET_RERANK_MODEL
        value: qwen-plus
      - key: NIAN_ASSET_TEXT_MODEL
        value: qwen-plus
      # 导演脚本确认后，将文字脚本编译为逐镜头任务与图片动态化 Prompt
      - key: VIDEO_PROJECT_PLANNER_MODEL
        value: qwen-plus
      - key: PYTHON_VERSION
        value: "3.11"
      # ─── Stage 1 用户系统 ───
      - key: JWT_SECRET
        generateValue: true   # Render 自动生成长随机串，重启不变
      - key: OWNER_ACCESS_CODE
        sync: false           # 在控制台手填，默认 NIAN-2026-OWNER
      - key: NIAN_DATA_DIR
        value: /var/data      # 配合下面 Disk 的挂载点
      # ─── Playwright Chromium 路径（PDF 生成用）───
      # 不设置自定义路径，让 build 和 runtime 都使用默认路径 /opt/render/.cache/ms-playwright
      # - key: PLAYWRIGHT_BROWSERS_PATH
      #   value: /opt/render/project/src/.playwright-browsers
      # ─── 可灵官方视频生成 API（新版，Bearer API Key）───
      # 在 Render 控制台填入从可灵官方控制台生成的 API Key；留空则自动 fallback 到 302.ai
      - key: KLING_API_KEY
        sync: false
      - key: KLING_MODEL_NAME
        value: kling-3.0-turbo
      # ─── 阿里云 OSS 持久化（推荐：彻底解决 Render 重启丢数据）───
      # 详见 OSS_SETUP.md。设为 1 启用；不填则继续用本地 Disk
      - key: OSS_ENABLE
        sync: false
      - key: OSS_ACCESS_KEY_ID
        sync: false
      - key: OSS_ACCESS_KEY_SECRET
        sync: false
      - key: OSS_BUCKET
        sync: false
      - key: OSS_ENDPOINT
        sync: false
      - key: OSS_PREFIX
        value: nian/
      # ─── 声音克隆及 TokenStar Seedance 首帧：外部服务需要公网 URL 拉取文件 ───
      # 填你的 Render 公网域名，例如 https://niannian-memorial.onrender.com
      - key: PUBLIC_BASE_URL
        sync: false
      # ─── 推荐：Bunny 临时 CDN 首帧，避免 TokenStar Data URI/multipart 500 ───
      - key: BUNNY_STORAGE_ZONE
        value: niannian
      - key: BUNNY_ACCESS_KEY
        sync: false
      - key: BUNNY_STORAGE_REGION
        value: sg
      - key: BUNNY_PULL_ZONE_URL
        value: https://NIAN.b-cdn.net
    healthCheckPath: /api/health
    # ─── 持久化磁盘（重要）───
    # ⚠️ 注意：此处 disk 段已注释，避免与 Render Dashboard 手动添加的 Disk 冲突。
    # 历史教训：render.yaml 的 disk 段和 Dashboard 的 Disk 同时存在时，
    # Render 可能在 deploy 时重建挂载卷，导致数据被清空（2025-XX 事件）。
    # 现在以 Dashboard 上手动挂载的 Disk(/var/data, 1GB) 为唯一来源。
    # 如要重新启用 IaC 管理，请先在 Dashboard 移除现有 Disk，再取消下面注释。
    # disk:
    #   name: niannian-data
    #   mountPath: /var/data
    #   sizeGB: 1
